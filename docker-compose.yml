version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: nightasaur-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nightasaur
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: nightasaur
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nightasaur"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: nightasaur-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_ORIGINS=*
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=2

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: nightasaur-backend
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: production
      PORT: 3002
      CORS_ORIGIN: ${CORS_ORIGIN}
      DATABASE_URL: postgresql://nightasaur:${DB_PASSWORD}@postgres:5432/nightasaur
      JWT_SECRET: ${JWT_SECRET}
      OLLAMA_URL: ${OLLAMA_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      WOO_URL: ${WOO_URL}
      WOO_KEY: ${WOO_KEY}
      WOO_SECRET: ${WOO_SECRET}
      CF_ACCESS_CLIENT_ID: ${CF_ACCESS_CLIENT_ID:-}
      CF_ACCESS_CLIENT_SECRET: ${CF_ACCESS_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  ollama_data:
