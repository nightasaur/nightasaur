[build]
builder = "RAILPACK"
buildCommand = "npm ci && npm -w apps/backend run db:generate && npm -w apps/backend run build"
watchPatterns = ["/apps/backend/**", "/packages/shared/**", "/package.json", "/package-lock.json", "/tsconfig.base.json"]

[deploy]
preDeployCommand = "npm -w apps/backend run preview:prepare"
startCommand = "npm -w apps/backend run start"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
