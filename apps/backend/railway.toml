[build]
  builder = "nixpacks"
  nixpacksConfigPath = "nixpacks.toml"
  buildCommand = "npm install && npx prisma generate && npm run build"
  
[deploy]
  numReplicas = 1
  startCommand = "npm start"
  healthcheckPath = "/api/health"
  healthcheckTimeout = 30

[service]
  name = "nightasaur-backend"
  
[[ports]]
  port = 3002
  protocol = "TCP"