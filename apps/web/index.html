    <title>Nightasaur｜夜間沉浸式 AI 平台</title>
<!-- PWA Installation Script -->
    <script>
      // 檢測是否為 iOS Safari
      const isIos = () => {
        const userAgent = window.navigator.userAgent.toLowerCase();
        return /iphone|ipad|ipod/.test(userAgent);
      };
      
      // 檢測是否為 Safari
      const isSafari = () => {
        const userAgent = window.navigator.userAgent.toLowerCase();
        return /safari/.test(userAgent) && !/chrome/.test(userAgent);
      };
      
      // 檢測是否為 iOS Safari
      const isIosSafari = isIos() && isSafari();
      
      // 檢測是否可安裝 PWA
      let deferredPrompt;
      
      window.addEventListener('beforeinstallprompt', (e) => {
        // 防止 Chrome 自動顯示安裝提示
        e.preventDefault();
        deferredPrompt = e;
        
        // 顯示自定義安裝按鈕
        setTimeout(() => {
          showInstallPrompt();
        }, 3000);
      });
      
      function showInstallPrompt() {
        const installBtn = document.getElementById('install-btn');
        if (installBtn && deferredPrompt) {
          installBtn.style.display = 'flex';
        }
      }
      
      async function installPWA() {
        if (!deferredPrompt) return;
        
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        
        if (outcome === 'accepted') {
          console.log('✅ 用戶接受了 PWA 安裝提示');
        } else {
          console.log('❌ 用戶拒絕了 PWA 安裝提示');
        }
        
        deferredPrompt = null;
        const installBtn = document.getElementById('install-btn');
        if (installBtn) {
          installBtn.style.display = 'none';
        }
      }
      
      // iOS 安裝提示
      function showIosInstallInstructions() {
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches;
        
        if (isIosSafari && !isStandalone) {
          setTimeout(() => {
            const iosInstall = document.getElementById('ios-install');
            if (iosInstall) {
              iosInstall.style.display = 'block';
            }
          }, 3000);
        }
      }
      
      // 註冊 Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then(registration => {
              console.log('✅ Service Worker 註冊成功:', registration.scope);
            })
            .catch(error => {
              console.log('❌ Service Worker 註冊失敗:', error);
            });
        });
      }
      
      // 初始化
      document.addEventListener('DOMContentLoaded', () => {
        showIosInstallInstructions();
      });
    </script>
    
    <style>
      /* PWA 安裝提示樣式 */
      #install-btn, #ios-install {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 9999;
        display: none;
      }
      
      .pwa-install-card {
        background: linear-gradient(135deg, #0a0d14 0%, #1a1f2e 100%);
        border: 2px solid #667eea;
        border-radius: 15px;
        padding: 15px;
        color: white;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        max-width: 300px;
        animation: slideIn 0.3s ease-out;
      }
      
      @keyframes slideIn {
        from {
          transform: translateY(100%);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }
      
      .pwa-install-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }
      
      .pwa-install-icon {
        font-size: 24px;
      }
      
      .pwa-install-title {
        font-weight: bold;
        font-size: 16px;
      }
      
      .pwa-install-desc {
        font-size: 14px;
        color: #a0aec0;
        margin-bottom: 15px;
      }
      
      .pwa-install-buttons {
        display: flex;
        gap: 10px;
      }
      
      .pwa-install-btn {
        flex: 1;
        padding: 8px 16px;
        border-radius: 8px;
        border: none;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
      }
      
      .pwa-install-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }
      
      .pwa-install-secondary {
        background: rgba(255, 255, 255, 0.1);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      
      .pwa-install-btn:hover {
        transform: translateY(-2px);
      }
      
      .pwa-install-close {
        position: absolute;
        top: 10px;
        right: 10px;
        background: none;
        border: none;
        color: #a0aec0;
        cursor: pointer;
        font-size: 18px;
      }
    </style>
  </head>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <body class="bg-gray-950 text-white font-sans">
    <div id="root"></div>
    
    <!-- PWA 安裝提示 (Chrome/Android) -->
    <div id="install-btn">
      <div class="pwa-install-card">
        <button class="pwa-install-close" onclick="this.parentElement.parentElement.style.display='none'">×</button>
        <div class="pwa-install-header">
          <div class="pwa-install-icon">📱</div>
          <div class="pwa-install-title">安裝 Nightasaur</div>
        </div>
        <div class="pwa-install-desc">
          將 Nightasaur 安裝到主畫面，獲得最佳體驗！
        </div>
        <div class="pwa-install-buttons">
          <button class="pwa-install-btn pwa-install-primary" onclick="installPWA()">
            安裝
          </button>
          <button class="pwa-install-btn pwa-install-secondary" onclick="this.parentElement.parentElement.parentElement.style.display='none'">
            稍後
          </button>
        </div>
      </div>
    </div>
    
    <!-- iOS 安裝指示 -->
    <div id="ios-install">
      <div class="pwa-install-card">
        <button class="pwa-install-close" onclick="this.parentElement.parentElement.style.display='none'">×</button>
        <div class="pwa-install-header">
          <div class="pwa-install-icon">📱</div>
          <div class="pwa-install-title">安裝到主畫面</div>
        </div>
        <div class="pwa-install-desc">
          在 Safari 中，點擊分享按鈕 <span style="font-size: 18px;">⎋</span>，然後選擇「加入主畫面」
        </div>
        <div class="pwa-install-buttons">
          <button class="pwa-install-btn pwa-install-primary" onclick="this.parentElement.parentElement.style.display='none'">
            知道了
          </button>
        </div>
      </div>
    </div>
    
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
