<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 360px; font-family: sans-serif; padding: 12px; background: #121826; color: #fff; }
    h3 { margin-top: 0; color: #a78bfa; }
    #chat-box { height: 220px; overflow-y: auto; background: #1f2937; padding: 8px; border-radius: 6px; font-size: 13px; margin-bottom: 8px; white-space: pre-wrap; }
    input { width: 70%; padding: 6px; border-radius: 4px; border: none; }
    button { width: 25%; padding: 6px; background: #7c3aed; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <h3>🌙 Nightasaur AI 載具</h3>
  <div id="chat-box">載入精靈記憶中...</div>
  <input type="text" id="user-input" placeholder="對靈靈講話..." />
  <button id="send-btn">發送</button>
  <script src="popup.js"></script>
</body>
</html>
